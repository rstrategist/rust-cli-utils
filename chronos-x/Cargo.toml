[package]
name = "chronos-x"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A CLI tool to generate a timestamp with an optional offset"
documentation = "https://docs.rs/chronos-4"
repository = "https://github.com/rstrategist/rust-cli-utils"

[dependencies]
clap = { version = "4.2", features = ["derive", "env"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
