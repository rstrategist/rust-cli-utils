[package]
name = "polars-lambda-axum"
version = "0.1.0"
edition = "2021"

[dependencies]
# AWS Lambda runtime / http
lambda_runtime = "0.14" # runtime core
lambda_http = "0.17"    # request/response helpers

# Optional: Axum + adapter for running the same app in Lambda
axum = { version = "0.6", features = ["headers"] }
axum-aws-lambda = "0.6"                            # adapter layer to run axum in Lambda

# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Logging / tracing
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# JSON / serde
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Polars — tune features to what you need (csv, parquet, lazy)
polars = { version = "0.33", features = ["lazy", "parquet", "csv", "json"] }

# Misc
anyhow = "1.0"
